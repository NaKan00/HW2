services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20
  application:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marketplace
      DB_USER: marketplace
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      JWT_SECRET: ${JWT_SECRET:-local-demo-signing-key-change-before-real-use-123456789}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-20}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      ORDER_RATE_LIMIT_MINUTES: ${ORDER_RATE_LIMIT_MINUTES:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminDemo123!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "/app/HealthProbe.java"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  postgres_data:
